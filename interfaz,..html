<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lista de Alumnos</h1>
    <div id="contenido">Cargando...</div>

    <script>
        fetch('http://127.0.0.1:5000/alumnos')
            .then(res => res.json())
            .then(data => {
                document.getElementById('contenido').innerText = JSON.stringify(data);
            })
            .catch(err => console.error("Error:", err));
    </script>
</body>
</html>
